[FORM0]
TITLE="Overview"
DESCRIPTION="This plugin polls values from a sonnenBatterie (V2 API) at a configurable interval and sends them to the Loxone Miniserver. Use Mapping to assign each API value to a Loxone control; host, token and send interval are configured under Settings."

PREP_TITLE="Preparation"
PREP_INTRO="Software integration"
PREP_STEP1="Enter the sonnenBatterie hostname or IP address in the Settings tab."
PREP_STEP2="Open the Sonnen API via %s"
PREP_STEP3="Copy the token and paste it into the plugin settings."
PREP_STEP4="At least enable the Read API."
PREP_STEP5="The Write API may not be activatable or usable depending on configurations (sonnenVPP, Preisoptimierung oder Direktmarketing)"
PREP_DOCURL="https://www.sonnen.de/rln-sb"
PREP_DOCURL_TEXT="Version Notes (german only) (v1.31.9)"
PREP_NOTE="Note: Web Hook and KNX are not used by this plugin."

